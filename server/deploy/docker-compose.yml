# The DJV sync server on the studio's dev server. Run from this folder with
# start.ps1 (or "docker compose up -d"); see README.md.
#
# Everything the server keeps is in ./data on the host: djv-sync.db (the
# sessions and the sign-ins) and config.json (the settings and the users).
# The passwords are in ./secrets, made by new-secrets.ps1, and reach the
# container as Docker secrets: they are in neither the image nor its
# environment.
#
# DJV_MEDIA_DIR (in .env) is the folder of review media that the host shares
# as the media share: share-setup.ps1 sets it. The server can write to it, so
# that the portal can upload videos there; the share itself stays read-only
# for the account DJV maps it with. Only the server writes.

name: djv-sync

services:
  djv-sync:
    # DJV_SYNC_IMAGE (in .env) names the image in a registry, such as
    # ghcr.io/<organization>/djv-sync-server, which start.ps1 pulls from.
    # Unset, it is the image the package carries in its .tar.
    image: ${DJV_SYNC_IMAGE:-djv-sync-server}:${DJV_SYNC_VERSION:-latest}
    container_name: djv-sync
    restart: unless-stopped
    ports:
      - "${DJV_PORT:-8877}:8877"
    environment:
      TZ: ${TZ:-UTC}
      # SQLite's write-ahead log keeps an index in shared memory, in a file
      # beside the database; a folder of a Windows host mounted into the
      # container cannot share that memory. Exclusive locking keeps the
      # index in the server instead. The database cannot then be opened by
      # another program while the server runs: copy it with backup.ps1.
      DB_EXCLUSIVE: ${DB_EXCLUSIVE:-1}
      # The administrator's user name; its password is the admin_password
      # secret.
      ADMIN_USER: ${ADMIN_USER:-admin}
    volumes:
      - ./data:/data
      # The long form, so that a media folder that is not there stops the
      # start rather than being made, empty, in the wrong place.
      - type: bind
        source: ${DJV_MEDIA_DIR:-./media}
        target: /media
    secrets:
      - admin_password
      - share_password
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  admin_password:
    file: ./secrets/admin_password.txt
  share_password:
    file: ./secrets/share_password.txt
